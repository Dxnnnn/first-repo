<!DOCTYPE html>
<html>
<head>
    <title>Modal Test</title>
    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background-color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        
        .hidden {
            display: none;
        }
        
        button {
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Modal Test</h1>
    <button id="testEditModal">Test Edit Modal</button>
    <button id="testDeleteModal">Test Delete Modal</button>

    <!-- Edit Department Modal -->
    <div id="editDepartmentModal" class="modal hidden">
        <div class="modal-content">
            <h3>Edit Department</h3>
            <p>This is the edit modal test.</p>
            <button id="closeEditDepartmentModal">Close</button>
        </div>
    </div>

    <!-- Delete Department Modal -->
    <div id="deleteDepartmentModal" class="modal hidden">
        <div class="modal-content">
            <h3>Delete Department</h3>
            <p>This is the delete modal test.</p>
            <button id="closeDeleteDepartmentModal">Close</button>
        </div>
    </div>

    <script>
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            
            document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden'));
            modal.classList.remove('hidden');
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.add('hidden');
        }

        document.getElementById('testEditModal').addEventListener('click', () => {
            openModal('editDepartmentModal');
        });

        document.getElementById('testDeleteModal').addEventListener('click', () => {
            openModal('deleteDepartmentModal');
        });

        document.getElementById('closeEditDepartmentModal').addEventListener('click', () => {
            closeModal('editDepartmentModal');
        });

        document.getElementById('closeDeleteDepartmentModal').addEventListener('click', () => {
            closeModal('deleteDepartmentModal');
        });
    </script>
</body>
</html>
